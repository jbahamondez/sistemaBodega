<!-- SesionParcial.html — login compartido e infraestructura de sesión.
     Se inserta en cada página con <?!= include('SesionParcial'); ?>.
     Expone window.Sesion: asegurar(rolRequerido, onListo), api(fn, args,
     onOk, onErr) que antepone el token, y cerrar(). -->
<style>
  #sesion-overlay { position: fixed; inset: 0; background: #4e342e; z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 1rem; }
  #sesion-overlay .caja { background: #fff; border-radius: 14px; padding: 1.6rem;
    width: 100%; max-width: 360px; font-family: system-ui, sans-serif; }
  #sesion-overlay h2 { margin: 0 0 .3rem; color: #4e342e; font-size: 1.2rem; }
  #sesion-overlay p.sub { margin: 0 0 1rem; color: #757575; font-size: .85rem; }
  #sesion-overlay label { display: block; font-size: .85rem; color: #6d4c41;
    margin-bottom: .8rem; }
  #sesion-overlay input { width: 100%; box-sizing: border-box; padding: .7rem;
    font-size: 1.05rem; border: 1px solid #e0d7ce; border-radius: 8px; margin-top: .3rem; }
  #sesion-overlay button { width: 100%; padding: .85rem; font-size: 1.05rem;
    font-weight: 700; background: #4e342e; color: #fff; border: none;
    border-radius: 10px; cursor: pointer; }
  #sesion-overlay button:disabled { background: #bbb; }
  #sesion-error { color: #c62828; font-size: .88rem; min-height: 1.2rem;
    margin: .5rem 0; white-space: pre-wrap; }
  #sesion-chip { position: fixed; bottom: .8rem; right: .8rem; z-index: 90;
    background: #fff; border: 1px solid #e0d7ce; border-radius: 20px;
    padding: .35rem .8rem; font-family: system-ui, sans-serif; font-size: .8rem;
    color: #4e342e; box-shadow: 0 1px 6px rgba(0,0,0,.15); display: none; }
  #sesion-chip button { background: none; border: none; color: #c62828;
    cursor: pointer; font-size: .8rem; padding: 0 0 0 .5rem; }
</style>

<div id="sesion-overlay">
  <div class="caja">
    <h2>🍫 Sistema Bodega</h2>
    <p class="sub">Identifícate para continuar</p>
    <form onsubmit="return Sesion._enviarLogin(event)">
      <label>Identificador
        <input id="sesion-usuario" autocomplete="username" autocapitalize="none">
      </label>
      <label>PIN
        <input id="sesion-pin" type="password" inputmode="numeric" autocomplete="current-password">
      </label>
      <div id="sesion-error"></div>
      <button type="submit" id="sesion-boton">Entrar</button>
    </form>
  </div>
</div>
<div id="sesion-chip">
  <span id="sesion-nombre"></span>
  <button onclick="Sesion.cerrar()">Salir</button>
</div>

<script>
window.Sesion = (function () {
  var CLAVE = 'sesion_bodega_v1';
  var datos = null;      // { token, usuario_id, nombre, rol }
  var pendiente = null;  // { rolRequerido, onListo }

  function leer() {
    try { return JSON.parse(localStorage.getItem(CLAVE) || 'null'); }
    catch (e) { return null; }
  }
  function guardar(d) {
    datos = d;
    try {
      if (d) localStorage.setItem(CLAVE, JSON.stringify(d));
      else localStorage.removeItem(CLAVE);
    } catch (e) { /* sin almacenamiento: la sesión vive en memoria */ }
  }
  function mostrarLogin(mensajeError) {
    document.getElementById('sesion-overlay').style.display = 'flex';
    document.getElementById('sesion-chip').style.display = 'none';
    document.getElementById('sesion-error').textContent = mensajeError || '';
    setTimeout(function () { document.getElementById('sesion-usuario').focus(); }, 100);
  }
  function ocultarLogin() {
    document.getElementById('sesion-overlay').style.display = 'none';
    document.getElementById('sesion-chip').style.display = '';
    document.getElementById('sesion-nombre').textContent =
      datos.nombre + ' (' + datos.rol + ')';
  }
  function completar() {
    if (pendiente.rolRequerido && datos.rol !== pendiente.rolRequerido) {
      guardar(null);
      mostrarLogin('Esta pantalla requiere rol ' + pendiente.rolRequerido +
        '. Inicia sesión con una cuenta autorizada.');
      return;
    }
    ocultarLogin();
    pendiente.onListo(datos);
  }

  return {
    /** Garantiza sesión válida (y rol, si se exige) antes de ejecutar onListo. */
    asegurar: function (rolRequerido, onListo) {
      pendiente = { rolRequerido: rolRequerido, onListo: onListo };
      var guardada = leer();
      if (!guardada || !guardada.token) { mostrarLogin(''); return; }
      // Validar contra el servidor: el token pudo expirar o el usuario
      // pudo ser desactivado.
      google.script.run
        .withSuccessHandler(function (info) {
          guardar({ token: guardada.token, usuario_id: info.usuario_id,
            nombre: info.nombre, rol: info.rol });
          completar();
        })
        .withFailureHandler(function () {
          guardar(null);
          mostrarLogin('');
        })
        .apiSesionInfo(guardada.token);
    },

    /** Llama a una función api* anteponiendo el token de la sesión. */
    api: function (fn, args, onOk, onErr) {
      var llamada = google.script.run
        .withSuccessHandler(onOk)
        .withFailureHandler(function (err) {
          var msg = (err && err.message) || String(err);
          if (msg.indexOf('Sesión expirada') !== -1) {
            guardar(null);
            mostrarLogin('La sesión expiró. Vuelve a entrar.');
            return;
          }
          if (onErr) onErr(err); else alert('Error: ' + msg);
        });
      llamada[fn].apply(null, [datos ? datos.token : ''].concat(args || []));
    },

    datos: function () { return datos; },

    cerrar: function () {
      var token = datos && datos.token;
      guardar(null);
      if (token) {
        google.script.run.withSuccessHandler(function () { location.reload(); })
          .withFailureHandler(function () { location.reload(); })
          .apiLogout(token);
      } else {
        location.reload();
      }
    },

    _enviarLogin: function (ev) {
      ev.preventDefault();
      var boton = document.getElementById('sesion-boton');
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          boton.disabled = false;
          document.getElementById('sesion-pin').value = '';
          guardar(r);
          completar();
        })
        .withFailureHandler(function (err) {
          boton.disabled = false;
          document.getElementById('sesion-error').textContent =
            (err && err.message) || String(err);
        })
        .apiLogin(document.getElementById('sesion-usuario').value,
                  document.getElementById('sesion-pin').value);
      return false;
    }
  };
})();
</script>
